<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06080f" />
    <script>
      // 无闪烁主题初始化: 在首屏绘制前应用已保存的主题(默认 dark)
      (function () {
        try {
          var t = localStorage.getItem('argent-theme') || 'dark';
          document.documentElement.dataset.theme = t;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', t === 'light' ? '#f4f5f7' : '#06080f');
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Argent</title>
    <link rel="icon" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <script type="module" crossorigin src="/assets/index-BZ0WbzF3.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Dj7-g6aL.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
    </script>
  </body>
</html>
