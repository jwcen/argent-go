    <script>
      // 防主题闪烁：必须在首帧绘制前同步跑完。若等 React 挂载再设，
      // 深色用户每次刷新都会先看到一帧白屏。
      (function () {
        try {
          var s = localStorage.getItem('argent-theme')
          var dark =
            s === 'dark' ||
            (s !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#000000' : '#f5f5f7')
        } catch (e) {}
      })()
    </script>
